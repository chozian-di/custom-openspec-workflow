[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-openspec-workflow"
version = "0.1.0"
description = "custom-openspec-workflow (COW, also known as \"chozian's OpenSpec Workflow\") provides a user-level policy and thin Grill Me adapter for stock OpenSpec."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
custom-openspec-init = "custom_openspec_workflow.bootstrap:main"
custom-openspec-grill = "custom_openspec_workflow.grill_cli:main"
custom-openspec-install = "custom_openspec_workflow.install:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
custom_openspec_workflow = [
  "data/*.yaml",
  "data/custom-openspec-grill/SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
